<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
    <style>
      html,body,#map{margin:0;height:100%;width:100%}
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script>
      const brewin_path_lon = 114.154869
      const brewin_path_lat = 22.273951
      const map = new maplibregl.Map({
          container: "map",
          zoom: 15,
          pitch: 70,
          maxPitch: 180,
          center: [brewin_path_lon, brewin_path_lat],
          style: "https://tiles.openfreemap.org/styles/liberty",
          maxZoom: 19
      });

      map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }));

      map.on("load", () => {
          // --- 3D terrain (raster-dem) ---
          map.addSource("terrainSource", {
              type: "raster-dem",
              url: "https://tiles.mapterhorn.com/tilejson.json"
          });
          map.addSource("hillshadeSource", {
              type: "raster-dem",
              url: "https://tiles.mapterhorn.com/tilejson.json"
          });
          map.addLayer({
              id: "hills",
              type: "hillshade",
              source: "hillshadeSource",
              layout: { visibility: "visible" },
              paint: { "hillshade-shadow-color": "#473B24" }
          });
          map.setTerrain({ source: "terrainSource", exaggeration: 1 });
          map.setSky({});
          map.addControl(
              new maplibregl.TerrainControl({ source: "terrainSource", exaggeration: 1 })
          );

          // --- 3D buildings (fill-extrusion from the openmaptiles vector source) ---
          // insert beneath the first text label so labels stay readable
          const layers = map.getStyle().layers;
          let labelLayerId;
          for (const layer of layers) {
              if (layer.type === "symbol" && layer.layout && layer.layout["text-field"]) {
                  labelLayerId = layer.id;
                  break;
              }
          }
          map.addLayer({
              id: "3d-buildings",
              source: "openmaptiles",
              "source-layer": "building",
              type: "fill-extrusion",
              minzoom: 14,
              paint: {
                  "fill-extrusion-color": "#cfd2d6",
                  "fill-extrusion-height": [
                      "interpolate", ["linear"], ["zoom"],
                      14, 0,
                      15.5, ["get", "render_height"]
                  ],
                  "fill-extrusion-base": ["get", "render_min_height"],
                  "fill-extrusion-opacity": 0.9
              }
          }, labelLayerId);

          new maplibregl.Marker()
              .setLngLat([brewin_path_lon, brewin_path_lat])
              .addTo(map);
      });
    </script>
  </body>
</html>
