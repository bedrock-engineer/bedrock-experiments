[project]
name = "bedrock-experiments"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bromodels>=0.0.1",
    "folium>=0.20.0",
    "geopandas>=1.1.1",
    "mapclassify>=2.10.0",
    "marimo[recommended]>=0.17.2",
    "matplotlib>=3.10.7",
    "pdfplumber>=0.11.7",
    "pint>=0.25.2",
    "polars>=1.34.0",
    "python-ags4>=1.1.0",
    "pyvista>=0.46.3",
    "pyzmq>=27.1.0",
    "specklepy>=3.0.8",
    "sqlmodel>=0.0.27",
    "striplog>=0.9.2",
    "sympy>=1.14.0",
    "trimesh>=4.11.1",
]

[[tool.mypy.overrides]]
module = ["pandas", "geopandas", "specklepy.*", "python_ags4.*", "requests"]
ignore_missing_imports = true
